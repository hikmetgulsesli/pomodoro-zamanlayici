<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temporal Sanctuary - Boş Durum</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#2a2a2a",
                    "inverse-on-surface": "#313030",
                    "tertiary-container": "#b38778",
                    "tertiary-fixed": "#ffdbd0",
                    "inverse-surface": "#e5e2e1",
                    "surface-container-lowest": "#0e0e0e",
                    "secondary-fixed-dim": "#70d8c8",
                    "outline": "#aa8980",
                    "on-tertiary-fixed": "#2f140b",
                    "on-primary-fixed": "#3b0900",
                    "surface-dim": "#131313",
                    "primary-fixed": "#ffdbd1",
                    "on-surface": "#e5e2e1",
                    "on-secondary-container": "#00302a",
                    "on-secondary": "#003731",
                    "surface-container-highest": "#353534",
                    "primary-container": "#fc5929",
                    "background": "#131313",
                    "error": "#ffb4ab",
                    "surface-container": "#201f1f",
                    "inverse-primary": "#b02e00",
                    "on-secondary-fixed-variant": "#005048",
                    "on-primary-container": "#541100",
                    "surface-variant": "#353534",
                    "surface-container-low": "#1c1b1b",
                    "primary-fixed-dim": "#ffb5a0",
                    "on-error": "#690005",
                    "on-secondary-fixed": "#00201c",
                    "on-primary": "#601500",
                    "outline-variant": "#5b4139",
                    "surface-bright": "#393939",
                    "surface": "#131313",
                    "error-container": "#93000a",
                    "on-primary-fixed-variant": "#872100",
                    "secondary": "#70d8c8",
                    "primary": "#ffb5a0",
                    "tertiary-fixed-dim": "#edbbac",
                    "on-background": "#e5e2e1",
                    "on-surface-variant": "#e4beb4",
                    "on-tertiary-container": "#402218",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#8df5e4",
                    "tertiary": "#edbbac",
                    "on-tertiary": "#47281e",
                    "secondary-container": "#32a192",
                    "on-tertiary-fixed-variant": "#613e33",
                    "surface-tint": "#ffb5a0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background: radial-gradient(circle at 50% 50%, rgba(252, 89, 41, 0.08) 0%, transparent 60%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 selection:text-primary min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-[#131313]/80 backdrop-blur-2xl shadow-[0_24px_48px_rgba(0,0,0,0.4)] flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="font-['Manrope'] font-extrabold text-[#FFB5A0] tracking-tighter text-lg">Temporal Sanctuary</span>
</div>
<div class="flex items-center gap-4">
<button class="text-[#E4BEB4] opacity-60 hover:bg-[#2A2A2A] transition-colors duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-20 pb-32 relative overflow-hidden bg-mesh">
<!-- Asymmetric Decorative Elements -->
<div class="absolute top-1/4 -right-20 w-96 h-96 bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-secondary/5 blur-[100px] rounded-full"></div>
<!-- Empty State Container -->
<div class="relative z-10 flex flex-col items-center text-center max-w-md w-full">
<!-- Motivational Icon Pulse -->
<div class="relative mb-12 group">
<div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full scale-150 group-hover:bg-primary/20 transition-all duration-700"></div>
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center shadow-[0_24px_48px_rgba(0,0,0,0.4)] border border-outline-variant/10">
<span class="material-symbols-outlined text-6xl text-primary" data-icon="hourglass_empty" style="font-variation-settings: 'wght' 200;">hourglass_empty</span>
</div>
<!-- Mini Floatings -->
<div class="absolute -top-4 -right-4 w-12 h-12 rounded-2xl bg-surface-container-highest flex items-center justify-center shadow-lg rotate-12">
<span class="material-symbols-outlined text-secondary" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
<!-- Text Content -->
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-4">
                Sessizliğin Gücü
            </h1>
<p class="text-on-surface-variant font-body text-lg leading-relaxed mb-10">
                Henüz bir veri yok. Zihnini dinlendirdin, şimdi odaklanma zamanı. <br/>
<span class="text-primary/80">İlk Pomodoronu tamamla!</span>
</p>
<!-- Call to Action -->
<div class="flex flex-col sm:flex-row gap-4 w-full">
<button class="flex-1 bg-primary text-on-primary font-headline font-bold py-4 px-8 rounded-full shadow-[0_8px_32px_rgba(252,89,41,0.2)] hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    Zamanlayıcıyı Başlat
                </button>
<button class="flex-1 bg-surface-container-high text-on-surface font-headline font-bold py-4 px-8 rounded-full border border-outline-variant/10 hover:bg-surface-container-highest transition-all duration-300 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="add_task">add_task</span>
                    Görev Ekle
                </button>
</div>
</div>
<!-- Secondary Meta Information (Asymmetric Placement) -->
<div class="mt-20 grid grid-cols-2 gap-8 opacity-40">
<div class="flex flex-col items-start border-l border-outline-variant/20 pl-4">
<span class="text-[10px] font-label uppercase tracking-widest mb-1">Durum</span>
<span class="text-xs font-body">Hazır Bekliyor</span>
</div>
<div class="flex flex-col items-start border-l border-outline-variant/20 pl-4">
<span class="text-[10px] font-label uppercase tracking-widest mb-1">Odak</span>
<span class="text-xs font-body">0 Dakika</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#1C1B1B]/60 backdrop-blur-xl rounded-t-[32px] shadow-[0_-8px_32px_rgba(0,0,0,0.5)]">
<!-- Zamanlayıcı (Active) -->
<button class="flex flex-col items-center justify-center bg-[#FC5929]/15 text-[#FFB5A0] rounded-[20px] px-6 py-2 transition-all duration-500 ease-in-out transform-gpu active:scale-90">
<span class="material-symbols-outlined" data-icon="timer">timer</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Zamanlayıcı</span>
</button>
<!-- İstatistikler -->
<button class="flex flex-col items-center justify-center text-[#E4BEB4] opacity-40 px-6 py-2 hover:opacity-100 hover:bg-[#2A2A2A]/40 transition-all duration-300 ease-in-out transform-gpu active:scale-90">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">İstatistikler</span>
</button>
<!-- Ayarlar -->
<button class="flex flex-col items-center justify-center text-[#E4BEB4] opacity-40 px-6 py-2 hover:opacity-100 hover:bg-[#2A2A2A]/40 transition-all duration-300 ease-in-out transform-gpu active:scale-90">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Ayarlar</span>
</button>
</div>
</body></html>
